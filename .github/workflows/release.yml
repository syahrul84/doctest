name: release

# Runs only when a version tag (v0.1.0 …) is pushed. Nothing is released until then.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=target/${{ matrix.target }}/release
          "$dir/doctest" --version || true   # x86_64 macOS is cross-built
          tar -C "$dir" -czf "doctest-${{ matrix.target }}.tar.gz" doctest
      - uses: actions/upload-artifact@v4
        with:
          name: doctest-${{ matrix.target }}
          path: doctest-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum doctest-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "doctest $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber

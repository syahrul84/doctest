[package]
name = "doctest"
version = "0.1.0"
edition = "2024"
description = "Keeps a Laravel + Vue project's user guide, system document and PHPUnit tests current, with an AI doing the writing"
license = "MIT"
repository = "https://github.com/syahrul84/doctest"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
headless_chrome = { version = "1.0.22", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
webp = { version = "0.3.1", default-features = false }
pulldown-cmark = "0.13.6"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = { version = "1.2.1", features = ["preserve_order"] }
